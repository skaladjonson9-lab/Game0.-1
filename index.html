<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка, совершённая карандашом</title>
    <style>
        body { margin: 0; padding: 0; background: #050507; color: #ffffff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; background-size: cover; background-position: center; transition: background-image 1s ease-in-out, filter 0.5s ease; }
        #menu-container { text-align: center; background: rgba(7, 7, 9, 0.95); padding: 40px; border: 2px solid #6b21a8; border-radius: 12px; box-shadow: 0 0 30px rgba(107, 33, 168, 0.4); width: 320px; }
        h1 { font-size: 20px; color: #c084fc; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; line-height: 1.5; text-shadow: 0 0 10px rgba(192, 132, 252, 0.5); }
        #game-container { display: none; width: 100%; height: 100vh; flex-direction: column; justify-content: flex-end; box-sizing: border-box; }
        #top-bar { position: fixed; top: 15px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        .save-btn { background: #111115 !important; border: 1px solid #4c1d95 !important; padding: 8px 16px !important; font-size: 14px !important; border-radius: 6px !important; text-shadow: none !important; text-align: center !important; color: white; cursor: pointer; transition: 0.3s; }
        .save-btn:hover { background: #581c87; border-color: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.4); }
        #story-window { background: rgba(7, 7, 9, 0.96); padding: 25px; border-top: 4px solid #6b21a8; min-height: 35vh; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); z-index: 10; display: flex; flex-direction: column; justify-content: space-between; width: 100%; box-sizing: border-box; }
        #speaker-name { font-size: 16px; color: #c084fc; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; text-shadow: 0 0 5px rgba(192, 132, 252, 0.3); }
        #text { font-size: 18px; line-height: 1.6; margin-bottom: 25px; color: #e4e4e7; min-height: 4.5em; text-shadow: none !important; }
        .buttons-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button { background: #111115; color: #f4f4f5; border: 1px solid #4c1d95; padding: 15px; font-size: 16px; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.3s ease; }
        button:hover:not(:disabled) { background: #581c87; border-color: #c084fc; transform: scale(1.02); box-shadow: 0 0 15px rgba(192, 132, 252, 0.4); }
        button:disabled { background: #09090b; color: #52525b; border-color: #1c1917; cursor: not-allowed; opacity: 0.4; }
        #story-window .buttons-list button { text-align: left; }
        #story-window .buttons-list button:hover { transform: translateX(5px); }
        .darkness-effect { filter: brightness(0.4) contrast(1.3); }
        .portal-effect { filter: hue-rotate(280deg) saturate(2); }
        .hell-effect { filter: sepia(0.5) hue-rotate(330deg) saturate(3) brightness(0.6); }
        .aplane-effect { filter: grayscale(0.2) contrast(1.1) sepia(0.2); }
        .void-effect { filter: brightness(0.2) contrast(2) saturate(0); }
        #custom-alert { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #111115; border: 2px solid #6b21a8; padding: 15px 25px; border-radius: 8px; box-shadow: 0 0 20px rgba(107, 33, 168, 0.6); z-index: 200; font-size: 15px; color: #c084fc; transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="custom-alert">💾 Игра успешно сохранена!</div>
    <div id="menu-container">
        <h1>Ошибка,<br>совершённая карандашом</h1>
        <div class="buttons-list" id="menu-buttons"></div>
    </div>
    <div id="game-container">
        <div id="top-bar">
            <button class="save-btn" onclick="saveCurrentGame()">💾 Сохранить</button>
            <button class="save-btn" style="border-color: #ef4444" onclick="showMainMenu()">🚪 Меню</button>
        </div>
        <div id="story-window">
            <div>
                <div id="speaker-name">Загрузка...</div>
                <div id="text">...</div>
            </div>
            <div class="buttons-list" id="game-buttons"></div>
        </div>
    </div>
    <script>
        const allChapters = {
            1: {
                "start": { speaker: "Глава 1: Истоки Парадокса", text: "Тебе всего 6 лет. После того как маньяк убил твою семью, ты остался совсем один в пустом доме, доедая остатки еды. Единственная радость — красный мячик. Но во время игры мяч улетает в окно и падает прямо в кузов странного фургона...", bg: "https://unsplash.com", effect: "none", color: "#6b21a8", choices: [{ text: "Побежать за мячом в фургон", nextScene: "van_inside" }, { text: "Остаться в пустом доме", nextScene: "stay_home" }] },
                "stay_home": { speaker: "Вмешательство", text: "Ты боишься выходить, но Тьма из будущего уже запустил свой план. Невидимая сила делает так, что ты всё равно покидаешь дом и проскальзываешь в фургон в самый последний момент.", bg: "https://unsplash.com", effect: "none", color: "#6b21a8", choices: [{ text: "Ехать в фургоне", nextScene: "van_inside" }] },
                "van_inside": { speaker: "Комплекс PainYosev", text: "Фургон привозит тебя в засекреченную лабораторию организации PainYosev. Будущий Тьма уже устроил здесь ЧП и отключил камеры. Охранники мечутся в панике, пока ты незаметно идешь по темным коридорам, следуя за странными светяшками, которые ведут тебя к цели...", bg: "https://unsplash.com", effect: "none", color: "#6b21a8", choices: [{ text: "Зайти в комнату с карандашом", nextScene: "pencil_room" }] },
                "pencil_room": { speaker: "Машрум (6 лет)", text: "Ты заходишь в кабинет, где светяшки указывают на стол. Там лежит карандаш — аномальный магический предмет, засекреченный PainYosev. Ты берешь его и выводишь на листе силуэт своего одиночества — Тьму.", bg: "https://unsplash.com", effect: "none", color: "#6b21a8", choices: [{ text: "Закончить рисунок", nextScene: "darkness_born" }] },
                "darkness_born": { speaker: "Создание Тьмы", text: "Рисунок мгновенно оживает. Перед тобой поднимается абсолютно черное существо с неровными белыми глазами — ведь шестилетний ребенок не может нарисовать идеально ровно. В этот же миг Тьма из будущего передает ему свои знания, память и часть сознания. Парадокс замкнулся. Тьма теперь знает абсолютно всё.", bg: "https://unsplash.com", effect: "darkness", color: "#000000", choices: [{ text: "Довериться Тьме", nextScene: "darkness_action" }] },
                "darkness_action": { speaker: "Тьма", text: "Тьма не теряет ни секунды. Облагая памятью из будущего, он мгновенно успокаивает тебя, берет за руку и переносит прочь из комплекса PainYosev вместе с магическим карандашом. Тьма оберегает тебя следующие четыре года...", bg: "https://unsplash.com", effect: "darkness", color: "#000000", choices: [{ text: "Завершить главу", nextScene: "main_menu", unlockChapter: 2 }] }
            },
            2: {
                "start": { speaker: "Глава 2: Новый друг", text: "Машруму исполнилось 10 лет. Наступает роковой момент: Тьма обязан покинуть создателя, чтобы не разорвать таймлайн и спасти вселенную от парадокса. Машрум снова остается один. В его руках лишь магический карандаш из архивов PainYosev. Тоска сжирает его, и он решает нарисовать себе нового друга — Пейна. Мальчика своего же возраста.", bg: "https://unsplash.com", effect: "none", color: "#2dd4bf", choices: [{ text: "Оживить Пейна", nextScene: "pein_born" }] },
                "pein_born": { speaker: "Машрум и Пейн", text: "В свои 10 лет Машрум рисует уже намного лучше. Из листа появляется Пейн — обычный с виду мальчик, ставший Машруму самым близким человеком. Они живут вместе целых пять лет, деля один дом и скрываясь от мира. Но всё меняется, когда им исполняется по 15 лет. Магический карандаш наделил Пейна скрытой, колоссальной аномальной силой...", bg: "https://unsplash.com", effect: "none", color: "#2dd4bf", choices: [{ text: "Узнать о силе Пейна", nextScene: "the_power" }] },
                "the_power": { speaker: "Пробуждение силы", text: "Пейн осознает, что стал невероятно силен — его мощь сравнима с Тьмой (хоть он и слабее него, но Пейн тогда о Тьме даже не догадывался). Главное — аномалия карандаша дала ему способность открывать порталы и перемещаться по вселенным. Пейн загорается жаждой приключений: «Машрум, тут ловить нечего! Погнали со мной исследовать другие миры!»", bg: "https://unsplash.com", effect: "portal", color: "#2dd4bf", choices: [{ text: "Машрум: «Я не отпущу тебя!»", nextScene: "the_argument" }] },
                "the_argument": { speaker: "Разрыв", text: "15-летний, еще психологически не сформированный Машрум впадает в панику. Страх одиночества парализует его. Сначала маньяк, потом Тьма... Он просто не может потерять ещё одного, последнего друга! Машрум кричит, запрещая ему уходить, умоляет остаться. Он до ужаса боится снова остаться один в пустом мире.", bg: "https://unsplash.com", effect: "none", color: "#2dd4bf", choices: [{ text: "Пейн делает свой выбор...", nextScene: "pein_leaves" }] },
                "pein_leaves": { speaker: "Эгоизм Пейна", text: "Но Пейна обуяла гордыня и жажда свободы. Крики и слезы друга его не останавливают. «Я не собираюсь гнить в этой дыре ради твоих страхов», — холодно бросает он. Пейн шагает в сияющий портал, оставляя плачущего Машрума на полу. Ссора навсегда разводит их пути. Пейн уходит грабить мультивселенную, где время течет совсем иначе...", bg: "https://unsplash.com", effect: "none", color: "#2dd4bf", choices: [{ text: "Завершить вторую главу", nextScene: "main_menu", unlockChapter: 3 }] }
            },
            3: {
                "start": { speaker: "Глава 3: Путь Пейна", text: "Пока во вселенной Машрума проходит всего 2 года (ему становится 17), Пейн в других мирах проживает целых 13 лет. К 28 годам он становится лучшим мафиози в мультивселенной, сея хаос и грабежи. Но роскошная жизнь обрывается внезапно — Пейн погибает от передозировки. Его эгоистичная душа падает на самое дно Ада.", bg: "https://unsplash.com", effect: "none", color: "#b91c1c", choices: [{ text: "Очнуться в Аду", nextScene: "hell_arrival" }] },
                "hell_arrival": { speaker: "Пейн (28 лет)", text: "Пейн открывает глаза в Преисподней. Он стал обычным, слабым демоном, но его гордость никуда не делась. Сдаваться он не намерен. Пейн начинает охоту — он режет местных демонов одного за другим, забирая и впитывая их силу, становясь монструозно могущественным. Вскоре этот кровавый след замечает сам Люцифер...", bg: "https://unsplash.com", effect: "hell", color: "#b91c1c", choices: [{ text: "Предстать перед Люцифером", nextScene: "lucifer_deal" }] },
                "lucifer_deal": { speaker: "Люцифер", text: "Владыка Ада, пораженный силой Пейна, решает взять его в ученики, планируя использовать его в своих целях. Пейн соглашается. Но это лишь уловка — Пейн решает подчиниться Люциферу только для того, чтобы подобраться поближе, превзойти его и украсть всю его дьявольскую силу.", bg: "https://unsplash.com", effect: "hell", color: "#b91c1c", choices: [{ text: "Нанести удар Люциферу", nextScene: "lucifer_betrayal" }] },
                "lucifer_betrayal": { speaker: "Предательство", text: "Выбрав момент, Пейн нападает на Люцифера. Но Владыка Ада успевает среагировать и в ужасе приказывает всей своей охране уничтожить предателя. Пейн пугается масштабной облавы и бросается в бега. Он ещё не осознает, что на самом деле ЕГО СИЛА УЖЕ ПРЕВОСХОДИТ ЛЮЦИФЕРА... Используя остатки портальных сил, Пейн в панике прыгает во случайную вселенную.", bg: "https://unsplash.com", effect: "hell", color: "#b91c1c", choices: [{ text: "Вырваться из Ада", nextScene: "scientist_lab" }] },
                "scientist_lab": { speaker: "СССР. Лаборатория Аплэна", text: "Пейн на бешеной скорости вылетает из портала и со всего размаху врезается в советского ученого Аплэна. Аплэн — гений этой вселенной, прямо сейчас держал в руках колбу со своей секретной «сыворотку яблока», превращающей всё живое в плоды. От удара колба разбивается, заливая их жидкостью...", bg: "https://unsplash.com", effect: "none", color: "#b91c1c", choices: [{ text: "Завершить третью главу", nextScene: "main_menu", unlockChapter: 4 }] }
            },
            4: {
                "start": { speaker: "Глава 4: Борьба за контроль", text: "Из-за побочного эффекта сыворотки тело Пейна распалось, но его душа намертво переместилась в Аплэна. Две души заперты в одном теле. Когда Аплэн засыпает, Пейн перехватывает контроль, хаотично прыгая по мультивселенной. Наконец, Аплэн конструирует уникальную маску. Она намертво подавляет сознание Пейна и позволяет ученому использовать его демонические силы для путешествий между мирами.", bg: "https://unsplash.com", effect: "none", color: "#6b21a8", choices: [{ text: "Надеть маску и отправиться в путь", nextScene: "aplane_travel" }] },
                "aplane_travel": { speaker: "Аплэн (Человек-Яблоко)", text: "Аплэн бросает свою старую советскую лабораторию. Он исследует изнанку реальности, даже не догадываясь, что Тьма из будущего уже заразил всю мультивселенную парадоксами. По первоначальному таймлайну Аплэн должен был создать Тьму только через 20 лет, но вмешательство изменило абсолютно всё...", bg: "https://unsplash.com", effect: "aplane", color: "#6b21a8", choices: [{ text: "Перенестись к Машруму", nextScene: "final_meeting" }] },
                "final_meeting": { speaker: "Великое столкновение", text: "Вселенные сжимаются. В одной точке сталкиваются все: 17-летний оригинальный Машрум и Аплэн, внутри которого заперт Пейн. В этот же миг просыпается Тьма, который спал тысячи лет в теле Аплэна, чтобы не портить нити времени. Таймлайн разрушен: Пейна не должно было существовать, Аплэн не должен был стать полуяблоком.", bg: "https://unsplash.com", effect: "none", color: "#6b21a8", choices: [{ text: "Тьма принимает решение...", nextScene: "universe_destruction" }] },
                "universe_destruction": { speaker: "Тьма", text: "В этой вселенной находится альтернативная копия Машрума, чье существование грозит стереть оригинал. Тьма раскрывает свои белые глаза на полную мощность. Реальность начинает трещать. Чтобы защитить своего истинного создателя — 17-летнего оригинального Машрума — Тьма полностью стирает эту альтернативную вселенную.", bg: "https://unsplash.com", effect: "void", color: "#6b21a8", choices: [{ text: "Взглянуть в пустоту", nextScene: "the_end" }] },
                "the_end": { speaker: "Парадокс Машрума", text: "Вселенная стерта. Осталась лишь пустота, Машрум и Тьма, запертые в бесконечной временной петле. Круг замкнулся. Спасибо, что прошли эту историю!", bg: "https://unsplash.com", effect: "none", color: "#6b21a8", choices: [{ text: "Вернуться в главное меню", nextScene: "main_menu" }] }
            }
        };
        let currentChapter = 1; let currentScene = "start"; let currentTimeout;

        if (!localStorage.getItem("unlocked_chapter_2")) localStorage.setItem("unlocked_chapter_2", "0");
        if (!localStorage.getItem("unlocked_chapter_3")) localStorage.setItem("unlocked_chapter_3", "0");
        if (!localStorage.getItem("unlocked_chapter_4")) localStorage.setItem("unlocked_chapter_4", "0");

        function showMainMenu() {
            clearTimeout(currentTimeout); document.getElementById('game-container').style.display = 'none'; document.getElementById('menu-container').style.display = 'block'; document.body.className = ''; document.body.style.backgroundImage = 'none';
            const hasSave = localStorage.getItem("saved_chapter") !== null; const btnContainer = document.getElementById('menu-buttons');
            btnContainer.innerHTML = `${hasSave ? '<button style="background: #2e1065; border-color: #a855f7" onclick="loadSavedGame()">Продолжить</button>' : ''}<button onclick="startChapter(1)">Новая игра</button><button onclick="showChaptersMenu()">Выбор главы</button>`;
        }

        function showChaptersMenu() {
            const btnContainer = document.getElementById('menu-buttons'); const ch2 = localStorage.getItem("unlocked_chapter_2") === "1"; const ch3 = localStorage.getItem("unlocked_chapter_3") === "1"; const ch4 = localStorage.getItem("unlocked_chapter_4") === "1";
            btnContainer.innerHTML = `<button onclick="startChapter(1)">Глава 1: Истоки</button><button onclick="startChapter(2)" ${ch2 ? '' : 'disabled'}>${ch2 ? 'Глава 2: Пейн' : '🔒 [Заблокировано]'}</button><button onclick="startChapter(3)" ${ch3 ? '' : 'disabled'}>${ch3 ? 'Глава 3: Ад' : '🔒 [Заблокировано]'}</button><button onclick="startChapter(4)" ${ch4 ? '' : 'disabled'}>${ch4 ? 'Глава 4: Финал' : '🔒 [Заблокировано]'}</button><button style="border-color: #ef4444; margin-top: 10px;" onclick="showMainMenu()">Назад</button>`;
        }

        function startChapter(chapNum) { currentChapter = chapNum; document.getElementById('menu-container').style.display = 'none'; document.getElementById('game-container').style.display = 'flex'; showScene('start'); }
        function saveCurrentGame() { localStorage.setItem("saved_chapter", currentChapter); localStorage.setItem("saved_scene", currentScene); alert("🔒 Игра успешно сохранена, родной!"); }
        function loadSavedGame() { const savedChap = localStorage.getItem("saved_chapter"); const savedScen = localStorage.getItem("saved_scene"); if (savedChap && savedScen) { currentChapter = parseInt(savedChap); document.getElementById('menu-container').style.display = 'none'; document.getElementById('game-container').style.display = 'flex'; showScene(savedScen); } }
        function typeWriter(text, i, fnCallback) {
            if (i < text.length) { document.getElementById('text').innerHTML = text.substring(0, i+1); currentTimeout = setTimeout(function() { typeWriter(text, i + 1, fnCallback) }, 15); }
            else if (typeof fnCallback == 'function') { fnCallback(); }
        }

        function showScene(sceneName) {
            if (sceneName === "main_menu") { showMainMenu(); return; }
            clearTimeout(currentTimeout); currentScene = sceneName; const scene = allChapters[currentChapter][sceneName]; if (!scene) return;
            document.getElementById('speaker-name').innerText = scene.speaker; document.body.style.backgroundImage = "url('" + scene.bg + "')"; document.body.className = '';
            if (scene.effect === "darkness") document.body.classList.add('darkness-effect');
            else if (scene.effect === "portal") document.body.classList.add('portal-effect');
            else if (scene.effect === "hell") document.body.classList.add('hell-effect');
            else if (scene.effect === "aplane") document.body.classList.add('aplane-effect');
            else if (scene.effect === "void") document.body.classList.add('void-effect');
            const buttonsContainer = document.getElementById('game-buttons'); buttonsContainer.innerHTML = '';
            typeWriter(scene.text, 0, function() {
                scene.choices.forEach(function(choice) {
                    const btn = document.createElement('button'); btn.innerText = choice.text;
                    btn.onclick = function() { if (choice.unlockChapter) { localStorage.setItem("unlocked_chapter_" + choice.unlockChapter, "1"); } showScene(choice.nextScene); };
                    buttonsContainer.appendChild(btn);
                });
            });
        }
        showMainMenu();
    </script>
</body>
</html>
