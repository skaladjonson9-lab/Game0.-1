<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка, совершённая карандашом</title>
    <style>
        body { margin: 0; padding: 0; background: #050507; color: #ffffff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
        #menu-container { text-align: center; background: rgba(7, 7, 9, 0.95); padding: 40px; border: 2px solid #6b21a8; border-radius: 12px; box-shadow: 0 0 30px rgba(107, 33, 168, 0.4); width: 320px; }
        h1 { font-size: 20px; color: #c084fc; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; line-height: 1.5; text-shadow: 0 0 10px rgba(192, 132, 252, 0.5); }
        .buttons-list { display: flex; flex-direction: column; gap: 12px; }
        button { background: #111115; color: #f4f4f5; border: 1px solid #4c1d95; padding: 15px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; }
        button:hover:not(:disabled) { background: #581c87; border-color: #c084fc; transform: scale(1.03); box-shadow: 0 0 15px rgba(192, 132, 252, 0.4); }
        button:disabled { background: #09090b; color: #52525b; border-color: #1c1917; cursor: not-allowed; opacity: 0.4; }
    </style>
</head>
<body>
    <div id="menu-container">
        <h1>Ошибка,<br>совершённая карандашом</h1>
        <div class="buttons-list" id="menu-buttons"></div>
    </div>
    <script>
        function showMainMenu() {
            const hasSave = localStorage.getItem("pencil_saved_file") !== null;
            const btnContainer = document.getElementById('menu-buttons');
            btnContainer.innerHTML = `
                ${hasSave ? '<button style="background: #2e1065; border-color: #a855f7" onclick="loadSavedGame()">Продолжить</button>' : ''}
                <button onclick="location.href='chapter1.html'">Новая игра</button>
                <button onclick="showChaptersMenu()">Выбор главы</button>
            `;
        }
        function showChaptersMenu() {
            const btnContainer = document.getElementById('menu-buttons');
            const ch2 = localStorage.getItem("pencil_unlocked_ch2") === "1";
            const ch3 = localStorage.getItem("pencil_unlocked_ch3") === "1";
            const ch4 = localStorage.getItem("pencil_unlocked_ch4") === "1";
            btnContainer.innerHTML = `
                <button onclick="location.href='chapter1.html'">Глава 1: Истоки</button>
                <button onclick="location.href='chapter2.html'" ${ch2 ? '' : 'disabled'}>${ch2 ? 'Глава 2: Пейн' : '🔒 Заблокировано'}</button>
                <button onclick="location.href='chapter3.html'" ${ch3 ? '' : 'disabled'}>${ch3 ? 'Глава 3: Ад' : '🔒 Заблокировано'}</button>
                <button onclick="location.href='chapter4.html'" ${ch4 ? '' : 'disabled'}>${ch4 ? 'Глава 4: Финал' : '🔒 Заблокировано'}</button>
                <button style="border-color: #ef4444; margin-top: 10px;" onclick="showMainMenu()">Назад</button>
            `;
        }
        function loadSavedGame() {
            const savedFile = localStorage.getItem("pencil_saved_file");
            if (savedFile) { location.href = savedFile; }
        }
        showMainMenu();
    </script>
</body>
</html>
<!DOCTYPE html>

        .save-btn { background: #111115 !important; border: 1px solid #4c1d95 !important; padding: 6px 12px !important; font-size: 13px !important; border-radius: 4px !important; text-align: center !important; color: white; cursor: pointer; transition: 0.3s; }
        .save-btn:hover { background: #581c87; border-color: #c084fc; }
        #speaker-name { font-size: 16px; color: #c084fc; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; text-shadow: 0 0 5px rgba(192, 132, 252, 0.3); }

        .buttons-list { display: flex; flex-direction: column; gap: 12px; }
        button { background: #111115; color: #f4f4f5; border: 1px solid #4c1d95; padding: 15px; font-size: 16px; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.3s ease; }
        button:hover { background: #581c87; border-color: #c084fc; transform: translateX(5px); box-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }

<body>
    <div id="custom-alert">💾 Игра сохранена на Главе 1!</div>
    <div id="text-box">
        <div id="interface-buttons">
            <button class="save-btn" onclick="saveGame()">💾 Сохранить</button>
            <button class="save-btn" style="border-color: #ef4444" onclick="location.href='index.html'">🚪 Меню</button>
        </div>
        <div>
            <div id="speaker-name">Загрузка...</div>
            <div id="text">...</div>
        </div>
        <div class="buttons-list" id="game-buttons"></div>
    </div>
    <script>
        const chapter1 = {
            "start": {
                speaker: "Глава 1: Истоки Парадокса",
                text: "Тебе всего 6 лет. После того как маньяк убил твою семью, ты остался совсем один в пустом доме, доедая остатки еды. Единственная радость — красный мячик. Но во время игры мяч улетает в окно и падает прямо в кузов странного фургона...",
                bg: "https://unsplash.com", effect: "none",
                choices: [{ text: "Пойти за мячом в фургон", nextScene: "van_inside" }, { text: "Остаться дома", nextScene: "stay_home" }]
            },
            "stay_home": {
                speaker: "Вмешательство",
                text: "Ты боишься выходить, но Тьма из будущего уже запустил свой план. Невидимая сила делает так, что ты всё равно покидаешь дом и проскальзываешь в фургон в самый последний момент.",
                bg: "https://unsplash.com", effect: "none",
                choices: [{ text: "Ехать в фургон", nextScene: "van_inside" }]
            },
            "van_inside": {
                speaker: "Комплекс PainYosev",
                text: "Фургон привозит тебя в засекреченную лабораторию организации PainYosev. Будущий Тьма уже устроил здесь ЧП и отключил камеры. Охранники мечутся в панике, пока ты незаметно идешь по темным коридорам, следуя за странными светяшками, которые ведут тебя к цели...",
                bg: "https://unsplash.com", effect: "none",
                choices: [{ text: "Зайти в комнату с карандашом", nextScene: "pencil_room" }]
            },
            "pencil_room": {
                speaker: "Машрум (6 лет)",
                text: "Ты заходишь в кабинет, где светяшки указывают на стол. Там лежит карандаш — аномальный магический предмет, засекреченный PainYosev. Ты берешь его и выводишь на листе силуэт своего одиночества — Тьму.",
                bg: "https://unsplash.com", effect: "none",
                choices: [{ text: "Закончить рисунок", nextScene: "darkness_born" }]
            },
            "darkness_born": {
                speaker: "Создание Тьмы",
                text: "Рисунок мгновенно оживает. Перед тобой поднимается абсолютно черное существо с неровными белыми глазами. Тьма из будущего передает ему свои знания, память и часть сознания. Парадокс замкнулся.",
                bg: "https://unsplash.com", effect: "darkness",
                choices: [{ text: "Довериться Тьме", nextScene: "darkness_action" }]
            },
            "darkness_action": {
                speaker: "Тьма",
                text: "Тьма не теряет ни секунды. Облагая памятью из будущего, он мгновенно успокаивает тебя, берет за руку и переносит прочь из комплекса PainYosev вместе с магическим карандашом. Первая глава завершена!",
                bg: "https://unsplash.com", effect: "darkness",
                choices: [{ text: "Завершить главу и выйти в меню", nextScene: "finish" }]
            }
        };
        let currentScene = "start"; let currentTimeout;
        function saveGame() {
            localStorage.setItem("pencil_saved_file", "chapter1.html");
            const alertBox = document.getElementById("custom-alert");
            alertBox.style.display = "block"; alertBox.style.opacity = "1";
            setTimeout(() => { alertBox.style.opacity = "0"; setTimeout(() => { alertBox.style.display = "none"; }, 300); }, 2000);
        }
        function typeWriter(text, i, fnCallback) {
            if (i < text.length) { document.getElementById('text').innerHTML = text.substring(0, i+1); currentTimeout = setTimeout(function() { typeWriter(text, i + 1, fnCallback) }, 15); }
            else if (typeof fnCallback == 'function') { fnCallback(); }
        }
        function showScene(sceneName) {
            if (sceneName === "finish") { localStorage.setItem("pencil_unlocked_ch2", "1"); location.href = "index.html"; return; }
            clearTimeout(currentTimeout); currentScene = sceneName;
            const scene = chapter1[sceneName]; if (!scene) return;
            document.getElementById('speaker-name').innerText = scene.speaker;
            document.body.style.backgroundImage = "url('" + scene.bg + "')";
            document.body.className = '';
            if (scene.effect === "darkness") document.body.classList.add('darkness-effect');
            const buttonsContainer = document.getElementById('game-buttons'); buttonsContainer.innerHTML = ''; 
            typeWriter(scene.text, 0, function() {
                scene.choices.forEach(function(choice) {
                    const btn = document.createElement('button'); btn.innerText = choice.text;
                    btn.onclick = function() { showScene(choice.nextScene); };
                    buttonsContainer.appendChild(btn);
                });
            });
        }
        window.onload = function() { showScene('start'); };
    </script>
</body>
</html>
