<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парадокс Машрума: Глава 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050507;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100vh;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out, filter 0.5s ease;
        }
        #game-container {
            background: rgba(7, 7, 9, 0.95);
            padding: 25px;
            border-top: 4px solid #7f1d1d;
            min-height: 38vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
        }
        #speaker-name {
            font-size: 16px;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        #text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e4e4e7;
            min-height: 4.8em;
        }
        #buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background: #18181b;
            color: #f4f4f5;
            border: 1px solid #27272a;
            padding: 15px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #7f1d1d;
            border-color: #f87171;
            transform: translateX(5px);
        }
        .darkness-effect {
            filter: brightness(0.4) contrast(1.3);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div>
            <div id="speaker-name">Загрузка...</div>
            <div id="text">...</div>
        </div>
        <div id="buttons"></div>
    </div>

    <script>
        const story = {
            "start": {
                speaker: "Глава 1: Истоки Парадокса",
                text: "Тебе всего 6 лет. После того как маньяк убил твою тему, ты остался совсем один в пустом доме, доедая остатки еды. Единственная радость — красный мячик. Но во время игры мяч улетает в окно и падает прямо в кузов странного фургона...",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Пойти за мячом в фургон", nextScene: "van_inside" },
                    { text: "Остаться дома", nextScene: "stay_home" }
                ]
            },
            "stay_home": {
                speaker: "Вмешательство",
                text: "Ты боишься выходить, но Тьма из будущего уже запустил свой план. Невидимая сила делает так, что ты всё равно покидаешь дом и проскальзываешь в фургон в самый последний момент.",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Ехать в фургоне", nextScene: "van_inside" }
                ]
            },
            "van_inside": {
                speaker: "Лаборатория",
                text: "Фургон привозит тебя в засекреченную лабораторию. Будущий Тьма уже устроил здесь ЧП и отключил камеры. Охранники мечутся в панике, пока ты незаметно идешь по темным коридорам, следуя за странными светяшками, которые ведут тебя к цели...",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Зайти в комнату с карандашом", nextScene: "pencil_room" }
                ]
            },
            "pencil_room": {
                speaker: "Машрум (6 лет)",
                text: "Ты заходишь в кабинет, где светяшки указывают на стол. Там лежит карандаш — аномальный магический предмет, настоящий объект уровня SCP. Ты берешь его и выводишь на листе силуэт своего одиночества — Тьму.",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Закончить рисунок", nextScene: "darkness_born" }
                ]
            },
            "darkness_born": {
                speaker: "Создание Тьмы",
                text: "Рисунок мгновенно оживает. Перед тобой поднимается абсолютно черное существо с неровными белыми глазами — ведь шестилетний ребенок не может нарисовать идеально ровно. В этот же миг Тьма из будущего передает ему свои знания, память и часть сознания. Парадокс замкнулся. Тьма теперь знает абсолютно всё.",
                bg: "https://unsplash.com",
                effect: "darkness",
                choices: [
                    { text: "Довериться Тьме", nextScene: "darkness_action" }
                ]
            },
            "darkness_action": {
                speaker: "Тьма",
                text: "Тьма не теряет ни секунды. Облагая памятью из будущего, он мгновенно успокаивает тебя, берет за руку и переносит прочь из лаборатории вместе с магическим карандашом. Тьма оберегает тебя следующие четыре года...",
                bg: "https://unsplash.com",
                effect: "darkness",
                choices: [
                    { text: "Конец Главы 1. Ждать продолжения...", nextScene: "end" }
                ]
            },
            "end": {
                speaker: "Система",
                text: "Машруму исполняется 10 лет, и Тьма покидает его ради сохранения таймлайна. Первая глава успешно загружена и работает на твоем сайте!",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Играть Главу 1 заново", nextScene: "start" }
                ]
            }
        };

        let currentTimeout;

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                document.getElementById('text').innerHTML = text.substring(0, i+1);
                currentTimeout = setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, 15);
            } else if (typeof fnCallback == 'function') {
                fnCallback();
            }
        }

        function showScene(sceneName) {
            clearTimeout(currentTimeout);
            const scene = story[sceneName];
            if (!scene) return;

            document.getElementById('speaker-name').innerText = scene.speaker;
            document.body.style.backgroundImage = "url('" + scene.bg + "')";

            document.body.className = '';
            if (scene.effect === "darkness") {
                document.body.classList.add('darkness-effect');
            }

            const buttonsContainer = document.getElementById('buttons');
            buttonsContainer.innerHTML = ''; 

            typeWriter(scene.text, 0, function() {
                scene.choices.forEach(function(choice) {
                    const btn = document.createElement('button');
                    btn.innerText = choice.text;
                    btn.onclick = function() { showScene(choice.nextScene); };
                    buttonsContainer.appendChild(btn);
                });
            });
        }

        window.onload = function() {
            showScene('start');
        };
    </script>
</body>
</html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парадокс Машрума: Финал</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050507;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100vh;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out, filter 0.5s ease;
        }
        #game-container {
            background: rgba(7, 7, 9, 0.95);
            padding: 25px;
            border-top: 4px solid #6b21a8;
            min-height: 38vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
        }
        #speaker-name {
            font-size: 16px;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        #text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e4e4e7;
            min-height: 4.8em;
        }
        #buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background: #18181b;
            color: #f4f4f5;
            border: 1px solid #27272a;
            padding: 15px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #581c87;
            border-color: #c084fc;
            transform: translateX(5px);
        }
        .aplane-effect {
            filter: grayscale(0.2) contrast(1.1) sepia(0.2);
        }
        .void-effect {
            filter: brightness(0.2) contrast(2) saturate(0);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div>
            <div id="speaker-name">Загрузка...</div>
            <div id="text">...</div>
        </div>
        <div id="buttons"></div>
    </div>

    <script>
        const story = {
            "start": {
                speaker: "Глава 4: Борьба за контроль",
                text: "Из-за побочного эффекта сыворотки тело Пейна распалось, а его душа вплавилась в Аплэна. Две личности заперты в одном теле. Когда Аплэн засыпает, Пейн перехватывает контроль, хаотично прыгая по мультивселенной. Наконец, Аплэн конструирует уникальную маску. Она намертво подавляет Пейна и позволяет ученому использовать его демонические силы для путешествий между мирами.",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Надеть маску и отправиться в путь", nextScene: "aplane_travel" }
                ]
            },
            "aplane_travel": {
                speaker: "Аплэн (Человек-Яблоко)",
                text: "Аплэн бросает свою советскую лабораторию и отправляется исследовать изнанку реальности, даже не догадываясь, что Тьма из будущего уже заразил всю мультивселенную парадоксами. По первоначальному таймлайну Аплэн должен был создать Тьму только через 20 лет, но вмешательство изменило абсолютно всё...",
                bg: "https://unsplash.com",
                effect: "aplane",
                choices: [
                    { text: "Перенестись к Машруму", nextScene: "final_meeting" }
                ]
            },
            "final_meeting": {
                speaker: "Великое столкновение",
                text: "Вселенные сжимаются. В одной точке сталкиваются все: 17-летний оригинальный Машрум и Аплэн, внутри которого заперт Пейн. В этот же миг просыпается Тьма, который спал тысячи лет, чтобы не портить нити времени. Таймлайн разрушен: Пейна не должно было существовать, Аплэн не должен был стать полуяблоком.",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Тьма принимает решение...", nextScene: "universe_destruction" }
                ]
            },
            "universe_destruction": {
                speaker: "Тьма",
                text: "В этой вселенной находится альтернативная версия Машрума, чье существование грозит стереть оригинал. Тьма раскрывает свои белые глаза на полную мощность. Реальность начинает трещать. Чтобы защитить своего истинного создателя — 17-летнего оригинального Машрума — Тьма полностью стирает эту альтернативную вселенную.",
                bg: "https://unsplash.com",
                effect: "void",
                choices: [
                    { text: "Взглянуть в пустоту", nextScene: "the_end" }
                ]
            },
            "the_end": {
                speaker: "Парадокс Машрума",
                text: "Вселенная стерта. Осталась лишь пустота, Машрум и Тьма, запертые в бесконечной временной петле. Круг замкнулся. Спасибо, что прошли эту историю!",
                bg: "https://unsplash.com",
                effect: "none",
                choices: [
                    { text: "Вернуться в начало финала", nextScene: "start" }
                ]
            }
        };

        let currentTimeout;

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                document.getElementById('text').innerHTML = text.substring(0, i+1);
                currentTimeout = setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, 15);
            } else if (typeof fnCallback == 'function') {
                fnCallback();
            }
        }

        function showScene(sceneName) {
            clearTimeout(currentTimeout);
            const scene = story[sceneName];
            if (!scene) return;

            document.getElementById('speaker-name').innerText = scene.speaker;
            document.body.style.backgroundImage = "url('" + scene.bg + "')";

            document.body.className = '';
            if (scene.effect === "aplane") {
                document.body.classList.add('aplane-effect');
            } else if (scene.effect === "void") {
                document.body.classList.add('void-effect');
            }

            const buttonsContainer = document.getElementById('buttons');
            buttonsContainer.innerHTML = ''; 

            typeWriter(scene.text, 0, function() {
                scene.choices.forEach(function(choice) {
                    const btn = document.createElement('button');
                    btn.innerText = choice.text;
                    btn.onclick = function() { showScene(choice.nextScene); };
                    buttonsContainer.appendChild(btn);
                });
            });
        }

        window.onload = function() {
            showScene('start');
        };
    </script>
</body>
</html>
