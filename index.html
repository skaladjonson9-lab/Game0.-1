<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ошибка, совершённая карандашом</title>
    <style>
        /* БЛОКИРОВКА СИНЕГО ВЫДЕЛЕНИЯ И ЦВЕТНЫХ МАСОК БРАУЗЕРА ПРИ КЛИКЕ */
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        
        body { margin: 0; padding: 0; background: #050507; color: #ffffff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; background-size: cover; background-position: center; transition: background-image 1s ease-in-out, filter 0.5s ease; overflow: hidden; }
        #menu-container { text-align: center; background: rgba(7, 7, 9, 0.95); padding: 40px; border: 2px solid #6b21a8; border-radius: 12px; box-shadow: 0 0 30px rgba(107, 33, 168, 0.4); width: 320px; z-index: 50; }
        h1 { font-size: 20px; color: #c084fc; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; line-height: 1.5; text-shadow: 0 0 10px rgba(192, 132, 252, 0.5); }
        
        /* ИГРОВОЙ КОНТЕЙНЕР НА ВЕСЬ ЭКРАН */
        #game-container { display: none; width: 100%; height: 100vh; flex-direction: column; justify-content: flex-end; box-sizing: border-box; position: relative; }
        
        #chapter-title-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100vh; background: #050507; z-index: 150; justify-content: center; align-items: center; cursor: pointer; text-align: center; padding: 20px; box-sizing: border-box; }
        #chapter-title-text { font-size: 24px; color: #c084fc; text-transform: uppercase; letter-spacing: 3px; font-weight: bold; text-shadow: 0 0 15px rgba(192, 132, 252, 0.6); line-height: 1.6; }
        
        #top-bar { position: fixed; top: 15px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        .save-btn { background: #111115 !important; border: 1px solid #4c1d95 !important; padding: 8px 16px !important; font-size: 14px !important; border-radius: 6px !important; text-shadow: none !important; text-align: center !important; color: white; cursor: pointer; transition: 0.3s; }
        .save-btn:hover { background: #581c87; border-color: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.4); }
        
        /* ЗОНА КНОПОК РАЗВИЛОК - ТЕПЕРЬ СТРОГО НАД СЮЖЕТНЫМ ОКНОМ */
        #choices-overlay { width: 100%; padding: 0 25px; box-sizing: border-box; margin-bottom: 15px; z-index: 20; display: flex; flex-direction: column; gap: 12px; }
        
        /* НИЖНЕЕ ОКНО СЮЖЕТА */
        #story-window { background: rgba(7, 7, 9, 0.96); padding: 25px; border-top: 4px solid #6b21a8; min-height: 38vh; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); z-index: 10; display: flex; flex-direction: column; justify-content: space-between; width: 100%; box-sizing: border-box; cursor: pointer; }
        #speaker-name { font-size: 16px; color: #c084fc; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; text-shadow: 0 0 5px rgba(192, 132, 252, 0.3); }
        #text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; color: #e4e4e7; min-height: 4.5em; text-shadow: none !important; }
        #click-hint { font-size: 12px; color: #a855f7; text-align: right; opacity: 0.6; margin-top: -10px; margin-bottom: 10px; animation: blink 1.5s infinite; }
        
        .buttons-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button { background: #111115; color: #f4f4f5; border: 1px solid #4c1d95; padding: 15px; font-size: 16px; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.3s ease; }
        button:hover:not(:disabled) { background: #581c87; border-color: #c084fc; transform: scale(1.02); box-shadow: 0 0 15px rgba(192, 132, 252, 0.4); }
        button:disabled { background: #09090b; color: #52525b; border-color: #1c1917; cursor: not-allowed; opacity: 0.4; }
        
        /* СТИЛИ ДЛЯ КНОПОК РАЗВИЛКИ НАД ТЕКСТОМ */
        #choices-overlay button { text-align: left; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #choices-overlay button:hover { transform: translateX(5px); }
        
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
        .darkness-effect { filter: brightness(0.4) contrast(1.3); }
        .portal-effect { filter: hue-rotate(280deg) saturate(2); }
        .hell-effect { filter: sepia(0.5) hue-rotate(330deg) saturate(3) brightness(0.6); }
        .aplane-effect { filter: grayscale(0.2) contrast(1.1) sepia(0.2); }
        .void-effect { filter: brightness(0.2) contrast(2) saturate(0); }

    </style>
</head>

            // Вывод названия главы СТРОГО ПО ЦЕНТРУ экрана на чёрном фоне
            const titleScreen = document.getElementById('chapter-title-screen');

            titleText.innerText = allChapters[chapNum].title;
            titleScreen.style.display = 'flex';

            document.getElementById('chapter-title-screen').style.display = 'none';
            renderCurrentLine();
        }        function saveCurrentGame(event) {
            if (event) event.stopPropagation();
            localStorage.setItem("saved_chapter", currentChapter);
            localStorage.setItem("saved_scene_index", currentDialogueIndex);
            localStorage.setItem("saved_subscene", inSubScene ? "1" : "0");
            localStorage.setItem("saved_subscene_key", currentSubSceneKey);
            
            const alertBox = document.getElementById("custom-alert");
            alertBox.classList.add("show");
            setTimeout(() => { alertBox.classList.remove("show"); }, 2000);
        }

        function loadSavedGame() {
            const savedChap = localStorage.getItem("saved_chapter");
            const savedIndex = localStorage.getItem("saved_scene_index");
            const savedSub = localStorage.getItem("saved_subscene");
            const savedSubKey = localStorage.getItem("saved_subscene_key");
            
            if (savedChap && savedIndex) {
                currentChapter = parseInt(savedChap);
                currentDialogueIndex = parseInt(savedIndex);
                inSubScene = savedSub === "1";
                currentSubSceneKey = savedSubKey || "";
                
                document.getElementById('menu-container').style.display = 'none';
                document.getElementById('game-container').style.display = 'flex';
                renderCurrentLine();
            }
        }

        function advanceStory() {
            if (isTyping) {
                clearTimeout(currentTimeout);
                document.getElementById('text').innerHTML = textToType;
                isTyping = false;
                return;
            }

            const chapter = allChapters[currentChapter];
            let currentList = inSubScene ? chapter.scenes[currentSubSceneKey].dialogues : chapter.dialogues;
            let currentForks = inSubScene ? chapter.scenes[currentSubSceneKey].forks : chapter.forks;

            if (currentDialogueIndex < currentList.length - 1) {
                currentDialogueIndex++;
                renderCurrentLine();
            } else {
                handleFork(currentForks);
            }
        }

        function handleFork(fork) {
            const buttonsContainer = document.getElementById('choices-overlay');
            buttonsContainer.innerHTML = '';

            if (fork.type === "choice") {
                document.getElementById('click-hint').style.display = 'none';
                fork.choices.forEach(function(choice) {
                    const btn = document.createElement('button');
                    btn.innerText = choice.text;
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        buttonsContainer.innerHTML = ''; // Скрываем развилку после выбора
                        inSubScene = true;
                        currentSubSceneKey = choice.nextScene;
                        currentDialogueIndex = 0;
                        document.getElementById('click-hint').style.display = 'block';
                        renderCurrentLine();
                    };
                    buttonsContainer.appendChild(btn);
                });
            } else if (fork.type === "next") {
                inSubScene = true;
                currentSubSceneKey = fork.nextScene;
                currentDialogueIndex = 0;
                renderCurrentLine();
            } else if (fork.type === "finish") {
                localStorage.setItem("unlocked_chapter_" + fork.nextChapter, "1");
                startChapter(fork.nextChapter);
            } else if (fork.type === "finish_game") {
                showMainMenu();
            }
        }

        function renderCurrentLine() {
            const chapter = allChapters[currentChapter];
            let currentList = inSubScene ? chapter.scenes[currentSubSceneKey].dialogues : chapter.dialogues;
            let line = currentList[currentDialogueIndex];

            document.getElementById('choices-overlay').innerHTML = '';
            document.getElementById('speaker-name').innerText = line.speaker;
            
            document.body.className = '';
            if (line.effect === "darkness") document.body.classList.add('darkness-effect');
            else if (line.effect === "portal") document.body.classList.add('portal-effect');
            else if (line.effect === "hell") document.body.classList.add('hell-effect');
            else if (line.effect === "aplane") document.body.classList.add('aplane-effect');
            else if (line.effect === "void") document.body.classList.add('void-effect');

            textToType = line.text;
            isTyping = true;
            typeWriter(textToType, 0, function() { isTyping = false; });
        }

        showMainMenu();
